<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ paper.title }}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
</head>
<body data-slug="{{ paper.slug }}">

  <nav id="toc">
    <h2>목차</h2>
    <div id="toc-list"></div>
  </nav>

  <div class="tap left"></div>
  <div class="tap right"></div>

  <main id="viewport">
    <div id="book"></div>
    <div id="footnotes" class="empty"></div>
  </main>

  <div id="popup"></div>

  <div id="ref-popup">
    <button class="rp-close">✕</button>
    <p class="rp-text"></p>
    <a class="rp-doi" target="_blank" rel="noopener">DOI 열기 ↗</a>
  </div>

  <div id="bar">
    <button id="toc-toggle">목차</button>
    <button id="lang" title="원문 ↔ 번역">원문</button>
    <button id="bookmark" title="북마크 (b)">🔖</button>
    <button id="font-minus" title="글자 작게">A−</button>
    <button id="font-plus" title="글자 크게">A+</button>
    <span id="title-label">{{ paper.title }}</span>
    <button id="prev">◀</button>
    <div id="progress"><div id="progress-fill"></div></div>
    <button id="next">▶</button>
    <span id="page-label">— / —</span>
  </div>

  <div id="loading">논문을 펼치는 중…</div>

  <script defer src="{{ url_for('static', filename='reader.js') }}"></script>
</body>
</html>
